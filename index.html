<p class="eyebrow hero-eyebrow"><span class="copper-dot"></span>DIGITAL CIRCUIT DESIGN</p>
<h1 id="hero-heading">회로를 설계하고,<br/><span>검증으로 증명합니다.</span></h1>
<p class="hero-description">반도체 검사장비용 Load Board 설계 실무를 바탕으로 RTL 설계·검증, FPGA 영상처리, SoC Integration까지 확장했습니다. 신호가 전달되는 경로부터 Logic 내부의 동작까지 확인하는 디지털 회로 설계 엔지니어입니다.</p>
